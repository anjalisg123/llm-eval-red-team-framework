[project]
name = "llm-eval-redteam"
version = "0.1.0"
description = "An LLM evaluation & red-teaming framework that stress-tests a RAG system against six failure categories using an LLM-as-judge, validated against human labels."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anjali Gudimani" }]

dependencies = [
    # --- Target RAG system ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "chromadb>=0.5",
    "openai>=1.30",
    # --- Eval framework ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",           # Cohen's kappa for judge-vs-human agreement
    "httpx>=0.27",           # black-box HTTP client to the target
    "tenacity>=8.2",         # retry/backoff around LLM calls
    "python-dotenv>=1.0",
    # --- Dashboard ---
    "streamlit>=1.33",
    "pandas>=2.2",
    "altair>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals", "target"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
